services:
  postgres:
    image: postgres:17-alpine

    container_name: dota2metatracker-postgres

    environment:
      POSTGRES_DB: dota2metatracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dota2metatracker"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  migrator:
    build:
      context: .
      dockerfile: Context/Dockerfile.migrations

    environment:
      ConnectionStrings__MetaTracker: "Host=postgres;Port=5432;Database=dota2metatracker;Username=postgres;Password=${POSTGRES_PASSWORD}"

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  api:
    image: dota2metatracker-api:latest

    build:
      context: .
      dockerfile: Api/Dockerfile

    container_name: dota2metatracker-api

    expose:
      - "8080"

    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      StratzApi__Token: "${STRATZ_API_TOKEN}"
      ConnectionStrings__MetaTracker: "Host=postgres;Port=5432;Database=dota2metatracker;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Cors__Origins: "${CORS_ORIGINS}"

    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

    restart: unless-stopped

  dota2metatracker:
    image: dota2metatracker:latest

    build:
      context: .
      dockerfile: TelegramBot/Dockerfile

    container_name: dota2metatracker

    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Telegram__Token: "${TELEGRAM_TOKEN}"
      Telegram__SecretToken: "${TELEGRAM_SECRET_TOKEN}"
      Telegram__WebhookUrl: "${TELEGRAM_WEBHOOK_URL}"
      Api__BaseUrl: "http://api:8080"

    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      api:
        condition: service_started

    restart: unless-stopped

  caddy:
    image: caddy:2-alpine

    container_name: dota2metatracker-caddy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./WebApp:/srv:ro
      - caddy-data:/data
      - caddy-config:/config

    depends_on:
      - api
      - dota2metatracker

    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
